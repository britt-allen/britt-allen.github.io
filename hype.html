<!DOCTYPE HTML>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO + Social -->
    <meta name="description" content="What others say about Brittany — a hype gallery.">
    <meta property="og:title" content="Brittany's Website — Hype">
    <meta property="og:description" content="What others say about Brittany — a hype gallery.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://britt-allen.github.io/hype.html">
    <meta property="og:image" content="https://britt-allen.github.io/files/social-preview.jpeg" />

    <title>Brittany's Website — Hype</title>

    <style>
        body {
            background-color: #edc6b1;
        }

        h1 {
            color: #92613e;
            font-family: "Gill Sans", sans-serif;
            font-size: 38px;
            letter-spacing: 1px;
        }

        p {
            color: #92613e;
            font-family: "Gill Sans", sans-serif;
            font-size: 20px;
            letter-spacing: 1px;
        }

        .content {
            max-width: 1500px;
            margin: auto;
            padding: 1rem;
        }

        a {
            color: #92613e;
            text-decoration: underline;
        }

        a:hover {
            color: #6b4a2f;
        }

        /* Hamburger nav */
        .navbar {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1000;
        }

        .hamburger-btn {
            background: none;
            color: #92613e;
            border: none;
            width: 88px;
            height: 88px;
            font-size: 40px;
            line-height: 1;
            cursor: pointer;
        }

        .hamburger-btn:hover {
            color: #6b4a2f;
        }

        .nav-menu {
            position: absolute;
            top: 96px;
            right: 0;
            background-color: #edc6b1;
            border: 2px solid #92613e;
            border-radius: 8px;
            min-width: 160px;
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.25s ease, opacity 0.2s ease;
        }

        .nav-menu.open {
            max-height: 300px;
            opacity: 1;
        }

        .nav-menu a {
            display: block;
            padding: 12px 16px;
            font-family: "Gill Sans", sans-serif;
            letter-spacing: 1px;
            text-decoration: none;
            border-bottom: 1px solid #d9ac91;
        }

        .nav-menu a:last-child {
            border-bottom: none;
        }

        .nav-menu a:hover {
            background-color: #d9ac91;
        }

        .nav-menu a.active {
            background-color: #d9ac91;
            color: #a9835f;
            pointer-events: none;
        }

        .gallery {
            column-count: 3;
            column-gap: 16px;
            margin-top: 1rem;
        }

        .item {
            margin-bottom: 16px;
            break-inside: avoid;
        }

        .item img {
            width: 100%;
            display: block;
            border-radius: 4px;
            cursor: zoom-in;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            transition: opacity 0.15s ease;
        }

        .item img:hover {
            opacity: 0.9;
        }

        @media (max-width: 1024px) {
            .gallery { column-count: 2; column-gap: 20px; }
        }

        @media (max-width: 640px) {
            .gallery { column-count: 1; column-gap: 0; }
            h1 { font-size: 32px; }
        }

        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
            padding: 2rem;
        }

        .lightbox.open {
            display: flex;
        }

        .lightbox img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 6px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <button class="hamburger-btn" id="hamburgerBtn" aria-expanded="false" aria-controls="navMenu" aria-label="Toggle navigation menu">&#9776;</button>
        <div class="nav-menu" id="navMenu">
            <a href="index.html">Home</a>
            <a href="portfolio.html">Portfolio</a>
            <a href="hype.html" class="active">Hype</a>
        </div>
    </nav>

    <div class="content">

        <h1>What others say 🌟</h1>

        <div class="gallery" id="gallery">
            <div class="item"><img src="files/2026-08-14-10-38-14.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/1656621811006.jpeg" alt="" loading="lazy"></div>
            <div class="item"><img src="files/1618509220281.jpeg" alt="" loading="lazy"></div>
            <div class="item"><img src="files/1574173398837.jpeg" alt="" loading="lazy"></div>
            <div class="item"><img src="files/2026-08-14-10-41-27.jpg" alt="" loading="lazy"></div>
            <div class="item"><img src="files/1574173398692.jpeg" alt="" loading="lazy"></div>
            <div class="item"><img src="files/10-55-17-PM.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/10-54-54-PM.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/10-54-32-PM.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/10-54-09-PM.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/10-53-50-PM.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/10-53-28-PM.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/10-53-02-PM.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/10-52-42-PM.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/10-52-16-PM.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/2-07-39-PM.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/10-51-55-PM.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/10-51-41-PM.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/10-51-10-PM.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/10-50-26-PM.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/10-49-03-PM.png" alt="" loading="lazy"></div>
    </div>

    </div>

    <div class="lightbox" id="lightbox">
        <img id="lightbox-img" src="">
    </div>

    <script>
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const navMenu = document.getElementById('navMenu');

        hamburgerBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            const isOpen = navMenu.classList.toggle('open');
            hamburgerBtn.setAttribute('aria-expanded', isOpen);
            hamburgerBtn.innerHTML = isOpen ? '&#10005;' : '&#9776;';
        });

        document.addEventListener('click', function (e) {
            if (!navMenu.contains(e.target) && e.target !== hamburgerBtn && navMenu.classList.contains('open')) {
                navMenu.classList.remove('open');
                hamburgerBtn.setAttribute('aria-expanded', 'false');
                hamburgerBtn.innerHTML = '&#9776;';
            }
        });

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        document.getElementById('gallery').addEventListener('click', (e) => {
            if (e.target.tagName === 'IMG') {
                lightboxImg.src = e.target.src;
                lightbox.classList.add('open');
            }
        });

        lightbox.addEventListener('click', () => {
            lightbox.classList.remove('open');
            lightboxImg.src = '';
        });
    </script>
</body>

</html>
