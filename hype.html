<!DOCTYPE HTML>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brittany's Website — Hype</title>

    <style>
        body {
            background-color: #edc6b1;
        }

        h1 {
            color: #92613e;
            font-family: "Gill Sans", sans-serif;
            font-size: 38px;
            letter-spacing: 1px;
        }

        p {
            color: #92613e;
            font-family: "Gill Sans", sans-serif;
            font-size: 20px;
            letter-spacing: 1px;
        }

        .content {
            max-width: 1500px;
            margin: auto;
            padding: 1rem;
        }

        a {
            color: #92613e;
            text-decoration: underline;
        }

        a:hover {
            color: #6b4a2f;
        }

        .back {
            margin-bottom: 1.5rem;
        }

        .gallery {
            column-count: 3;
            column-gap: 16px;
            margin-top: 1rem;
        }

        .item {
            margin-bottom: 16px;
            break-inside: avoid;
        }

        .item img {
            width: 100%;
            display: block;
            border-radius: 4px;
            cursor: zoom-in;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            transition: opacity 0.15s ease;
        }

        .item img:hover {
            opacity: 0.9;
        }

        @media (max-width: 1024px) {
            .gallery { column-count: 2; column-gap: 20px; }
        }

        @media (max-width: 640px) {
            .gallery { column-count: 1; column-gap: 0; }
            h1 { font-size: 32px; }
        }

        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
            padding: 2rem;
        }

        .lightbox.open {
            display: flex;
        }

        .lightbox img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 6px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body>
    <div class="content">

        <div class="back">
            <a href="index.html">← Home</a>
        </div>

        <h1>What's all the hype about? 🌟</h1>

        <div class="gallery" id="gallery">
            <div class="item"><img src="files/2026-08-14-10-38-14.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/1656621811006.jpeg" alt="" loading="lazy"></div>
            <div class="item"><img src="files/1618509220281.jpeg" alt="" loading="lazy"></div>
            <div class="item"><img src="files/1574173398837.jpeg" alt="" loading="lazy"></div>
            <div class="item"><img src="files/2026-08-14-10-41-27.jpg" alt="" loading="lazy"></div>
            <div class="item"><img src="files/1574173398692.jpeg" alt="" loading="lazy"></div>
            <div class="item"><img src="files/10-55-17-PM.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/10-54-54-PM.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/10-54-32-PM.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/10-54-09-PM.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/10-53-50-PM.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/10-53-28-PM.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/10-53-02-PM.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/10-52-42-PM.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/10-52-16-PM.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/2-07-39-PM.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/10-51-55-PM.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/10-51-41-PM.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/10-51-10-PM.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/10-50-26-PM.png" alt="" loading="lazy"></div>
            <div class="item"><img src="files/10-49-03-PM.png" alt="" loading="lazy"></div>
    </div>

    </div>

    <div class="lightbox" id="lightbox">
        <img id="lightbox-img" src="">
    </div>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        document.getElementById('gallery').addEventListener('click', (e) => {
            if (e.target.tagName === 'IMG') {
                lightboxImg.src = e.target.src;
                lightbox.classList.add('open');
            }
        });

        lightbox.addEventListener('click', () => {
            lightbox.classList.remove('open');
            lightboxImg.src = '';
        });
    </script>
</body>

</html>
